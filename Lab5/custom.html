
<!DOCTYPE html>
<html>
<head>
    <title>Todd Dickinson's First Web Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <script>
        // Initialize the map
        var map = L.map('map').fitWorld();
        
        // Add OpenStreetMap tiles
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
        
        // Updated coordinates for accuracy
        // TAMU landmarks coordinates
        //var kyleField = [30.6084, -96.3402];
        var kyleField = [30.6098, -96.3403];
        // var omBuilding = [30.6179, -96.3386];
        var omBuilding = [30.6177, -96.3366];
        //var academicBuilding = [30.6159, -96.3413];
        var academicBuilding = [30.6157, -96.3408];
        

        // Try to locate the user
        map.locate({setView: true, maxZoom: 16});
        
        // Location found event handler
        function onLocationFound(e) {
            var radius = e.accuracy / 2;
            L.marker(e.latlng).addTo(map)
                .bindPopup("You are within " + radius + " meters from this point").openPopup();
            L.circle(e.latlng, radius).addTo(map);
        }
        
        // Location error event handler
        function onLocationError(e) {
            // If geolocation fails, center on Kyle Field
            map.setView(kyleField, 15);
            alert("Location access was denied or unavailable. Map centered on Kyle Field.");
        }

        // 
        var popup = L.popup();

        function onMapClick(e) {
            popup
                .setLatLng(e.latlng)
                .setContent("You clicked the map at " + e.latlng.toString())
                .openOn(map);
        }

        map.on('click', onMapClick);
        
        // Create a circle around Kyle Field with popup
        var kyleCircle = L.circle(kyleField, {
            radius: 150,        // meters
            color: 'red',       // circle outline color
            fillColor: '#f03',  // fill color
            fillOpacity: 0.4
        }).addTo(map);

        kyleCircle.bindPopup("Kyle Field<br>Home of the Fightin' Texas Aggies!");
                
        // Create custom icons for O&M and Academic Building

        // Texas A&M maroon
        var aggieMaroon = '#500000';  // you can tweak this if you like

        var omIcon = L.icon({
            iconUrl: 'Globe.png',
            iconSize: [32, 32],
            iconAnchor: [16, 32],
            popupAnchor: [0, -32]
        });

        var academicIcon = L.icon({
            iconUrl: 'AcademicCap.png',
            iconSize: [32, 32],
            iconAnchor: [16, 32],
            popupAnchor: [0, -32]
        });

        L.marker(omBuilding, { icon: omIcon })
        .addTo(map)
        .bindPopup("O&amp;M Building");

        L.marker(academicBuilding, { icon: academicIcon })
        .addTo(map)
        .bindPopup("Academic Building");

        // Create click event to show coordinates in popup
        
        // Register event handlers
        map.on('locationfound', onLocationFound);
        map.on('locationerror', onLocationError);
    </script>
</body>
</html>
